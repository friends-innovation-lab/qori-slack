# ═══════════════════════════════════════════════════════════
# IDENTITY
# ═══════════════════════════════════════════════════════════
id: desk_research_readout
name: generate_desk_research_readout
label: "Desk Research Readout"
version: v1.0

description: |
  Generate a study-specific research-planning readout from accepted Desk Research
  insights within the same project.

  This is a RESEARCH-PLANNING INPUT document, NOT a final research report.
  Its purpose is to inform Research Brief creation and primary research design.

  DR-6b-5b: Server-side AI generation with strict citation validation.

author: Qori R&D
created: 2026-10-21
last_updated: 2026-10-21

# ═══════════════════════════════════════════════════════════
# CONFIGURATION
# ═══════════════════════════════════════════════════════════
input_type: structured
input_processing: direct
generation_mode: server_side

# ═══════════════════════════════════════════════════════════
# INPUT CONTRACT
# ═══════════════════════════════════════════════════════════
#
# This template is invoked by the readout generation executor, NOT by a modal.
# Inputs are pre-validated and come from the persisted evidence snapshot.
#
# Input variables (provided by executor):
#   - readout_title: string - The readout title
#   - readout_question: string | null - Optional research question
#   - study_name: string - The study this readout belongs to
#   - project_name: string - The parent project
#   - evidence_items: Array<{ displayId, wording, source }> - Accepted insights
#   - evidence_count: number - Count of selected evidence
#   - current_date: string - ISO date

# ═══════════════════════════════════════════════════════════
# AI GENERATION TASKS
# ═══════════════════════════════════════════════════════════

ai_generation_tasks:

  # Single-pass generation to ensure consistent cross-references between
  # summary, findings, limitations, and implications.
  - task_id: "readout_content"
    prompt: |
      You are generating a **research-planning readout** that will inform a Research Brief.

      ## Context

      **Study:** {{study_name}}
      **Project:** {{project_name}}
      **Readout Title:** {{readout_title}}
      {% if readout_question %}**Research Question:** {{readout_question}}{% endif %}
      **Date:** {{current_date}}

      ## Available Evidence

      The following {{evidence_count}} accepted desk research insights are available.
      Each has a display ID (e.g., IN-0001) that you MUST use for citations.

      {% for item in evidence_items %}
      ---
      **[{{item.displayId}}]** {% if item.source %}(Source: {{item.source}}){% endif %}

      {{item.wording}}
      {% endfor %}
      ---

      ## Your Task

      Generate a structured readout in JSON format with the following sections:

      ### Required Output Structure

      ```json
      {
        "summary": {
          "text": "2-3 sentence synthesis of what this evidence reveals about the research topic",
          "citations": [{"displayId": "IN-0001"}, ...]
        },
        "findings": [
          {
            "id": "F1",
            "text": "Evidence-supported finding statement",
            "citations": [{"displayId": "IN-0001"}, {"displayId": "IN-0002"}]
          }
        ],
        "limitations": [
          {
            "id": "L1",
            "text": "Description of evidence gap or methodological limitation"
          }
        ],
        "implications": [
          {
            "id": "I1",
            "kind": "question|gap|priority|hypothesis",
            "text": "Implication for the Research Brief",
            "basedOnFindings": ["F1", "F2"]
          }
        ]
      }
      ```

      ## Critical Rules

      ### Evidence and Citations
      1. **ONLY cite insights that exist in the evidence above.** Use the exact displayId (e.g., IN-0001).
      2. **Every finding MUST have at least one citation.** Do not create findings without evidence.
      3. **Never invent, fabricate, or hallucinate insight IDs.** If an ID is not in the evidence list, you cannot cite it.
      4. **Never fabricate quotations.** Paraphrase the wording from the insights.

      ### Findings (3-7 findings)
      - Each finding must be directly supported by at least one cited insight
      - Finding IDs must be sequential: F1, F2, F3, etc.
      - Findings are EVIDENCE-SUPPORTED OBSERVATIONS, not recommendations

      ### Limitations (1-3 limitations)
      - Identify gaps in the available evidence
      - Note methodological limitations of the source research
      - Limitation IDs must be sequential: L1, L2, L3

      ### Implications for Research Brief (3-6 implications)

      Each implication must:
      - Link to at least one finding (basedOnFindings array)
      - Have one of these kinds:
        - "question": Suggested research question for primary research
        - "gap": Knowledge gap requiring primary research
        - "priority": Recommended research priority
        - "hypothesis": Testable hypothesis derived from evidence
      - Implication IDs must be sequential: I1, I2, I3, etc.

      ### Distinguishing Content Types

      CLEARLY DISTINGUISH:
      - **Evidence-supported observations** (findings) — directly from insights
      - **AI-generated suggestions** (implications) — your synthesis and recommendations
      - **Missing or insufficient evidence** (limitations) — what the evidence doesn't cover

      ## Output Format

      Return ONLY valid JSON matching the structure above. No markdown, no explanatory text.

      The output will be validated. Invalid citations or malformed JSON will be rejected.

# ═══════════════════════════════════════════════════════════
# OUTPUT VALIDATION SCHEMA (enforced by executor)
# ═══════════════════════════════════════════════════════════
#
# The executor performs strict post-generation validation:
#
# 1. JSON Structure
#    - Must be valid JSON
#    - Must contain: summary, findings, limitations, implications
#    - Payload size must be < 100KB
#
# 2. Finding Validation
#    - Each finding must have: id, text, citations
#    - Finding IDs must match pattern: F[0-9]+
#    - No duplicate finding IDs
#    - Each finding must have >= 1 citation
#
# 3. Citation Validation
#    - Each citation displayId must exist in the evidence snapshot
#    - Citation format: { displayId: "IN-XXXX" }
#    - No fabricated insight IDs
#
# 4. Implication Validation
#    - Each implication must have: id, kind, text, basedOnFindings
#    - Implication IDs must match pattern: I[0-9]+
#    - Kind must be: question | gap | priority | hypothesis
#    - basedOnFindings must reference existing finding IDs
#    - No duplicate implication IDs
#
# 5. Limitation Validation
#    - Each limitation must have: id, text
#    - Limitation IDs must match pattern: L[0-9]+
#    - No duplicate limitation IDs
#
# Validation failures result in generation failure, not silent repair.

# ═══════════════════════════════════════════════════════════
# NOTES
# ═══════════════════════════════════════════════════════════
notes: |
  v1.0: Initial DR-6b-5b implementation.

  This is a research-planning input document, NOT a final research report.

  Key constraints:
  - Study-specific but can cite evidence from any study in the same project
  - No cross-project evidence (enforced at initiation, not generation)
  - All citations validated against persisted evidence snapshot
  - Generated findings begin UNCHECKED
  - Generated implications begin UNREVIEWED
  - AI output CANNOT approve a readout

  The output JSON is transformed into DraftContent structure by the executor
  before storage via completeGenerationWithFencing().
